name: CI

on:
  push:
    branches: [main, finish]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HA_VERSION: "2026.2.3"

jobs:
  test:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 is what the add-on image runs (Alpine 3.24). 22 is the oldest supported.
        node: [22, 24]
    defaults:
      run:
        working-directory: addons/scratcha/rootfs/opt/scratcha
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: addons/scratcha/rootfs/opt/scratcha/package-lock.json
      - run: npm ci
      - run: npm test

  lint-addon:
    name: Add-on linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-app-linter@v2.21.1
        with:
          path: "./addons/scratcha"

  yaml:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install yamllint
      - run: yamllint --strict .

  e2e:
    name: End to end (real Home Assistant)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            .github/workflows/ci.yml
            test/tools/install-ha.sh
      # Also installs the frontend HA pins, which homeassistant does not pull in.
      - name: Install Home Assistant
        run: |
          sh test/tools/install-ha.sh "$RUNNER_TEMP/ha-venv" "$HA_VERSION"
          echo "SCRATCHA_HASS=$RUNNER_TEMP/ha-venv/bin/hass" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: addons/scratcha/rootfs/opt/scratcha
      - run: npm ci
        working-directory: test
      - run: npm run e2e
        working-directory: test

  browser:
    name: Browser (Playwright Chromium)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            .github/workflows/ci.yml
            test/tools/install-ha.sh
      # Also installs the frontend HA pins, which homeassistant does not pull in.
      - name: Install Home Assistant
        run: |
          sh test/tools/install-ha.sh "$RUNNER_TEMP/ha-venv" "$HA_VERSION"
          echo "SCRATCHA_HASS=$RUNNER_TEMP/ha-venv/bin/hass" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: addons/scratcha/rootfs/opt/scratcha
      - run: npm ci
        working-directory: test
      - run: npx playwright-core install --with-deps chromium
        working-directory: test
      - run: npm run browser
        working-directory: test
